spring:
  application:
    name: checkout-service

server:
  port: 8080

payment:
  gateway:
    api-key: ${PAYMENT_GATEWAY_API_KEY}
    timeout-ms: 5000
    sdk-version: v3
    region: us-east-1

checkout:
  cart-ttl-minutes: 30
  max-items: 50

logging:
  level:
    com.sectra.checkout: INFO

